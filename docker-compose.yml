services:
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data:/data

  web:
    build: .
    container_name: pipeline-web
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - UPLOAD_ROOT=/shared_uploads
    ports:
      - "8000:8000"
    volumes:
      - shared_uploads_volume:/shared_uploads
      - ./app/my_config.ini:/app/my_config.ini
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  worker-default:
    build: .
    depends_on: [ redis ]
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - UPLOAD_ROOT=/shared_uploads
    volumes:
      - shared_uploads_volume:/shared_uploads
    deploy:
      resources:
        limits:
          memory: 2g
    command: >
      celery -A app.tasks:celery_app worker --pool=prefork --concurrency=1 -Q default -l info

  worker-slicer:
    build: .
    depends_on: [ redis ]
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - UPLOAD_ROOT=/shared_uploads
    volumes:
      - shared_uploads_volume:/shared_uploads
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2g
    command: >
      celery -A app.tasks:celery_app worker --pool=prefork --concurrency=3 -Q slice -l info

volumes:
  redis-data:
  shared_uploads_volume:
