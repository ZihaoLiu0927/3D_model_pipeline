# my_config.ini
# -------------------------
# Printer and filament settings for headless slicing

# Printer preset
printer_settings_id = Original Prusa MK4
bed_shape = 0x0,250x0,250x210,0x210
nozzle_diameter = 0.4

# Filament preset
filament_settings_id = Generic PLA
filament_type = PLA
filament_diameter = 1.75
filament_density = 1.24
filament_cost = 25
filament_notes = "Generic PLA"

# Print preset
print_settings_id = 0.2mm QUALITY @MK4
layer_height = 0.2
perimeters = 2
infill_density = 15%
infill_pattern = grid
support_material = 0
top_solid_layers = 4
bottom_solid_layers = 4

# General
output_filename_format = {input_filename_base}.gcode
